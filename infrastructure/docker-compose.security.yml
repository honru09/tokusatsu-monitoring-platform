# Opt-in hardening. Not used by pnpm compose:up, deploy/gcp-auto-migrate.sh,
# or scripts/gcp-update.sh. Apply it only after the owner sets a URL-safe
# REDIS_PASSWORD (letters, digits, and . _ ~ -) and accepts a Redis restart:
#
#   docker compose --env-file .env \
#     -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.security.yml \
#     up -d
#
# A read-only root and dropping all capabilities are intentionally absent.
# Postgres needs to change user and write its data directory, and the API
# and worker write temporary files. The operations gateway already sets
# those limits in the base file. This overlay was not started against a
# live stack in the remediation run; validate it in a disposable
# environment before production.

services:
  redis:
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "512mb",
        "--maxmemory-policy", "noeviction",
        "--auto-aof-rewrite-percentage", "100",
        "--auto-aof-rewrite-min-size", "64mb",
        "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD before enabling docker-compose.security.yml}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD before enabling docker-compose.security.yml}
    ports: !override []
    networks: !override
      - data
    security_opt: ["no-new-privileges:true"]

  postgres:
    networks: !override
      - data
    security_opt: ["no-new-privileges:true"]

  api:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD before enabling docker-compose.security.yml}@redis:6379
    networks: !override
      - data
      - app
    security_opt: ["no-new-privileges:true"]

  worker:
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD before enabling docker-compose.security.yml}@redis:6379
    networks: !override
      - data
      - app
    security_opt: ["no-new-privileges:true"]

  web:
    networks: !override
      - app
    security_opt: ["no-new-privileges:true"]

  gateway:
    networks: !override
      - app

networks:
  data:
    internal: true
  app: {}
