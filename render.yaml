  - type: worker
    name: tokusatsu-monitor-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./workers/crawlers/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    dockerCommand: sh -c "pnpm --filter @tokusatsu/db migrate:deploy && node workers/crawlers/dist/index.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tokusatsu-monitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tokusatsu-monitor-kv
          type: keyvalue
          property: connectionString
      - key: REAL_ADAPTER_ENABLED
        value: "true"
      - key: MOCK_ADAPTER_ENABLED
        value: "false"
      - key: MANDARAKE_SEARCH_ENABLED
        value: "false"
      - key: MERCARI_SEARCH_ENABLED
        value: "true"
      - key: YAHOO_AUCTIONS_SEARCH_ENABLED
        value: "true"
      - key: YAHOO_FLEAMARKET_SEARCH_ENABLED
        value: "true"
      - key: YAHOO_SHOPPING_SEARCH_ENABLED
        value: "true"
      - key: YAHOO_SHOPPING_CLIENT_ID
        sync: false
      - key: YAHOO_SHOPPING_API_URL
        value: https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch
      - key: YAHOO_SHOPPING_SEARCH_INTERVAL_MS
        value: "7200000"
      - key: YAHOO_SHOPPING_CRAWL_DELAY_MS
        value: "1100"
      - key: RAKUMA_SEARCH_ENABLED
        value: "true"
      - key: SURUGAYA_SEARCH_ENABLED
        value: "true"
      - key: YAHOO_FLEAMARKET_SEARCH_INTERVAL_MS
        value: "3600000"
      - key: RAKUMA_SEARCH_INTERVAL_MS
        value: "7200000"
      - key: SURUGAYA_SEARCH_INTERVAL_MS
        value: "10800000"
      - key: YAHOO_FLEAMARKET_BACKFILL_INTERVAL_MS
        value: "21600000"
      - key: RAKUMA_BACKFILL_INTERVAL_MS
        value: "28800000"
      - key: YAHOO_FLEAMARKET_CRAWL_DELAY_MS
        value: "5000"
      - key: RAKUMA_CRAWL_DELAY_MS
        value: "3000"
      - key: SURUGAYA_CRAWL_DELAY_MS
        value: "30000"
      - key: MARKET_KEYWORDS
        value: 仮面ライダー|仮面ライダー まとめ売り|仮面ライダー DX|仮面ライダー ベルト|仮面ライダー ソフビ|仮面ライダー 食玩|仮面ライダー ガシャポン|ウルトラマン|特撮 まとめ売り
      - key: MARKET_INCREMENTAL_INTERVAL_MS
        value: "900000"
      - key: MARKET_BACKFILL_INTERVAL_MS
        value: "10800000"
      - key: MARKET_BACKFILL_MAX_PAGES
        value: "80"
      - key: FIRECRAWL_DISCOVERY_ENABLED
        value: "false"
      - key: FIRECRAWL_DISCOVERY_INTERVAL_MS
        value: "7200000"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_API_URL
        value: https://api.firecrawl.dev
      - key: FIRECRAWL_INCLUDE_DOMAINS
        value: jp.mercari.com,item.fril.jp,www.suruga-ya.jp,order.mandarake.co.jp,paypayfleamarket.yahoo.co.jp,item.rakuten.co.jp,www.amazon.co.jp,www.ebay.com,netmall.hardoff.co.jp,store.shopping.yahoo.co.jp
      - key: FIRECRAWL_ALLOW_ANY_DOMAIN
        value: "false"
      # Provider credentials are intentionally API-only. Empty Worker values
      # make the isolation explicit even if environment groups are added later.
      - key: BAI_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""
      - key: SILICONFLOW_API_KEY
        value: ""
      - key: CEREBRAS_API_KEY
        value: ""
      - key: CLOUDFLARE_AI_API_TOKEN
        value: ""
      - key: CLOUDFLARE_ACCOUNT_ID
        value: ""
      - key: COHERE_API_KEY
        value: ""
      - key: NVIDIA_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: AI_INTERNAL_TOKEN
        sync: false
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: AI_GATEWAY_CLIENT_TIMEOUT_MS
        value: "270000"
      - key: TITLE_TRANSLATION_BATCH_SIZE
        value: "2"
      - key: DETAIL_TRANSLATION_BATCH_SIZE
        value: "2"
      - key: MARKET_INTEL_INTERVAL_MS
        value: "3600000"
      - key: MARKET_INTEL_MAX_AGE_DAYS
        value: "90"
      - key: APIFY_ECOMMERCE_ENABLED
        value: "false"
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ECOMMERCE_ACTOR
        value: apify~e-commerce-scraping-tool
      - key: APIFY_MARKETPLACES
        value: www.amazon.co.jp,item.rakuten.co.jp,www.ebay.com,store.shopping.yahoo.co.jp,netmall.hardoff.co.jp
      - key: APIFY_DISCOVERY_INTERVAL_MS
        value: "21600000"
      - key: PLAYWRIGHT_WS_ENDPOINT
        sync: false
      - key: PLAYWRIGHT_EXECUTABLE_PATH
        sync: false
      - key: INVENTORY_CLEANUP_INTERVAL_MS
        value: "7200000"
      - key: CRAWLER_CONTACT
        sync: false
      - key: CRAWLER_USER_AGENT
        sync: false

  - type: web
    name: tokusatsu-monitor-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /backend
      - key: API_INTERNAL_URL
        fromService:
          name: tokusatsu-monitor-api
          type: pserv
          property: hostport
      - key: AI_PROXY_TIMEOUT_MS
        value: "270000"

databases:
  - name: tokusatsu-monitor-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: tokusatsu
    user: tokusatsu
    diskSizeGB: 1
    ipAllowList: []
