services:
  - type: keyvalue
    name: tokusatsu-monitor-kv
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: pserv
    name: tokusatsu-monitor-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tokusatsu-monitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tokusatsu-monitor-kv
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://tokusatsu-monitor-web.onrender.com
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_INCLUDE_DOMAINS
        value: jp.mercari.com,item.fril.jp,www.suruga-ya.jp,order.mandarake.co.jp
      - key: FIRECRAWL_ALLOW_ANY_DOMAIN
        value: "false"

  - type: worker
    name: tokusatsu-monitor-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./workers/crawlers/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    dockerCommand: sh -c "pnpm --filter @tokusatsu/db migrate:deploy && node workers/crawlers/dist/index.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tokusatsu-monitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tokusatsu-monitor-kv
          type: keyvalue
          property: connectionString
      - key: REAL_ADAPTER_ENABLED
        value: "true"
      - key: MOCK_ADAPTER_ENABLED
        value: "false"
      - key: MANDARAKE_SEARCH_ENABLED
        value: "false"
      - key: YAHOO_AUCTIONS_SEARCH_ENABLED
        value: "true"
      - key: MARKET_KEYWORDS
        value: 仮面ライダー|仮面ライダー まとめ売り|仮面ライダー DX|仮面ライダー ベルト|仮面ライダー ソフビ|仮面ライダー 食玩|仮面ライダー ガシャポン|ウルトラマン|特撮 まとめ売り
      - key: MARKET_INCREMENTAL_INTERVAL_MS
        value: "900000"
      - key: MARKET_BACKFILL_INTERVAL_MS
        value: "10800000"
      - key: MARKET_BACKFILL_MAX_PAGES
        value: "80"
      - key: FIRECRAWL_DISCOVERY_ENABLED
        value: "true"
      - key: FIRECRAWL_DISCOVERY_INTERVAL_MS
        value: "7200000"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_API_URL
        value: https://api.firecrawl.dev
      - key: FIRECRAWL_INCLUDE_DOMAINS
        value: jp.mercari.com,item.fril.jp,www.suruga-ya.jp,order.mandarake.co.jp
      - key: FIRECRAWL_ALLOW_ANY_DOMAIN
        value: "false"
      - key: INVENTORY_CLEANUP_INTERVAL_MS
        value: "7200000"
      - key: CRAWLER_CONTACT
        sync: false
      - key: CRAWLER_USER_AGENT
        sync: false
      - key: VISION_API_URL
        sync: false
      - key: VISION_API_KEY
        sync: false

  - type: web
    name: tokusatsu-monitor-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /backend
      - key: API_INTERNAL_URL
        fromService:
          name: tokusatsu-monitor-api
          type: pserv
          property: hostport

databases:
  - name: tokusatsu-monitor-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: tokusatsu
    user: tokusatsu
    diskSizeGB: 1
    ipAllowList: []
