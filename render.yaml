services:
  - type: keyvalue
    name: tokusatsu-monitor-kv
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: pserv
    name: tokusatsu-monitor-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tokusatsu-monitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tokusatsu-monitor-kv
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://tokusatsu-monitor-web.onrender.com
