packages:
  - apps/*
  - workers/*
  - packages/*
  - services/*

nodeVersion: 24.19.0
runtimeOnFail: error
pmOnFail: error

overrides:
  # Same-major advisory patches. zod 4, stream-json 3, minimatch 11, and
  # vitest 4 / tinypool 2 are intentionally not forced: their callers are
  # pinned to the previous major.
  "@nestjs/platform-express>multer": 2.5.0
  "@prisma/config>deepmerge-ts": 8.0.0
  "next>postcss": 8.5.23
  "next>sharp": 0.35.5
  "router>path-to-regexp": 8.4.2
  "proxy-addr": 2.0.8
  "body-parser": 2.4.0
  "qs": 6.17.1
  "undici": 7.30.2
  "axios": 1.21.0
  "follow-redirects": 1.16.2
  "adm-zip": 0.6.1
  "vite": 7.3.7
  "source-map-js": 1.2.2
  "postcss-selector-parser": 6.1.5
  "brace-expansion": 2.1.7

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.70"
  - ai@7.0.87
  - undici@7.30.2
